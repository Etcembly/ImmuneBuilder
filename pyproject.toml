[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ImmuneBuilder"
version = "1.2"
description = "Set of functions to predict the structure of immune receptor proteins"
readme = "README.md"
license = { text = "BSD 3-clause license" }
maintainers = [
    { name = "Brennan Abanades", email = "brennan.abanadeskenyon@stx.ox.ac.uk" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.6",
    "einops>=0.3",
    "torch>=1.8",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "pre-commit>=3.0",
]
all = ["ImmuneBuilder[dev]"]

[project.scripts]
ABodyBuilder2 = "ImmuneBuilder.ABodyBuilder2:command_line_interface"
TCRBuilder2 = "ImmuneBuilder.TCRBuilder2:command_line_interface"
NanoBodyBuilder2 = "ImmuneBuilder.NanoBodyBuilder2:command_line_interface"

[project.urls]
Homepage = "https://github.com/brennanaba/ImmuneBuilder"
Documentation = "https://github.com/brennanaba/ImmuneBuilder/blob/main/README.md"
Repository = "https://github.com/brennanaba/ImmuneBuilder"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ImmuneBuilder", "ImmuneBuilder.*"]
