name: Unit Tests

on:
  push:
    branches: [ main, annarailton/immune-builder-service ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pytest pytest-asyncio
        pip install fastapi python-multipart

    - name: Run unit tests
      run: pytest test_fastapi_app.py -v
